_BASE_: "./Base-RCNN-FPN.yaml"
MODEL:
  BACKBONE:
    NAME: "mask_rcnn_vitdet_mini"
    FREEZE_AT: 2
  MASK_ON: True
  #WEIGHTS: "detectron2://ViTDet/COCO/cascade_mask_rcnn_vitdet_b/f325358525/model_final_435fa9.pkl"
  WEIGHTS: "/Data/Models/COCO/20250306-003126/model_final.pth"
  ANCHOR_GENERATOR:
    SIZES: [[4], [8], [16], [64], [256]]
    ASPECT_RATIOS: [[0.5, 1.0, 2.0]]
  ROI_HEADS:
    NUM_CLASSES: 100
    SCORE_THRESH_TEST: 0.05
  RPN:
    IN_FEATURES: ["p2", "p3", "p4", "p5", "p6"]

DATALOADER:
  NUM_WORKERS: 4

DATASETS:
  TRAIN: ("coco_2017_train",)
  TEST: ("coco_2017_val",)

INPUT:
  FORMAT: "RGB"

SOLVER:
  AMP:
    ENABLED: True

  IMS_PER_BATCH: 64
  MAX_ITER: 20000
  STEPS: (12000, 18000)
  WARMUP_ITERS: 10
  BASE_LR: 1e-5
  CHECKPOINT_PERIOD: 500

TEST:
  EVAL_PERIOD: 500

OUTPUT_DIR: "/Data/Models/COCO"
