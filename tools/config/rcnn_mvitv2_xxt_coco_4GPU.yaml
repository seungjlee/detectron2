_BASE_: "./Base-RCNN-FPN.yaml"
MODEL:
  BACKBONE:
    NAME: "rcnn_mvitv2_xxt"
    FREEZE_AT: 2
  MASK_ON: False
  #WEIGHTS: "/Data/Models/COCO/20250316-210746/model_0032999.pth"
  #WEIGHTS: "/Data/Models/COCO/20250317-020134/model_final.pth"
  #WEIGHTS: "/Data/Models/COCO/20250317-121015/model_best.pth"
  WEIGHTS: "/Data/Models/COCO/20250317-175558/model_final.pth"
  ANCHOR_GENERATOR:
    SIZES: [[4], [8], [16], [64], [256]]
    ASPECT_RATIOS: [[0.5, 1.0, 2.0]]
  ROI_HEADS:
    NUM_CLASSES: 100
    SCORE_THRESH_TEST: 0.05
  RPN:
    IN_FEATURES: ["p2", "p3", "p4", "p5", "p6"]

DATALOADER:
  NUM_WORKERS: 4

DATASETS:
  TRAIN: ("coco_2017_train",)
  TEST: ("coco_2017_val",)

INPUT:
  FORMAT: "RGB"

SOLVER:
  AMP:
    ENABLED: True

  IMS_PER_BATCH: 32
  MAX_ITER: 40000
  STEPS: (26000, 36000)
  WARMUP_ITERS: 30
  BASE_LR: 1e-5
  CHECKPOINT_PERIOD: 1000

TEST:
  EVAL_PERIOD: 1000

OUTPUT_DIR: "/Data/Models/COCO"
